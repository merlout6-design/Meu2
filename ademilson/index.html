<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Debug Mode</title>
    
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Toastify -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Chewy&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: fadeIn 0.2s; backdrop-filter: blur(2px); }
        .modal-box { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); position: fixed; height: 100%; z-index: 50; } .sidebar.open { transform: translateX(0); } }
        input[type="color"] { -webkit-appearance: none; border: none; width: 40px; height: 40px; border-radius: 8px; overflow: hidden; padding: 0; cursor: pointer; border: 1px solid #ddd; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; } input[type="color"]::-webkit-color-swatch { border: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAf7ML3Gd9kJQI5XcowCRlH0F1VF7x-gMI",
            authDomain: "rodaodef.firebaseapp.com",
            projectId: "rodaodef",
            storageBucket: "rodaodef.firebasestorage.app",
            messagingSenderId: "232817991067",
            appId: "1:232817991067:web:09d1a2226f09696710153e",
            measurementId: "G-W3C2VH0QFP"
        };
        
        if (!firebase.apps.length) { 
            try { firebase.initializeApp(firebaseConfig); } catch (e) { console.error(e); } 
        }
        
        const auth = firebase.auth(); 
        const db = firebase.firestore(); 
        const APP_ID = "rodaodef"; // ISSO DEVE BATER COM AS REGRAS
        
        const getCol = (n) => db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection(n);
        const getConfigDoc = () => db.collection('artifacts').doc(APP_ID).collection('public').doc('data').collection('config').doc('main');
        
        const { useState, useEffect, useMemo } = React;
        const formatMoney = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        // --- MENSAGEM DO WHATSAPP ---
        async function sendWhatsAppNotification(phone, statusKey, customerName, settings) {
            if (!phone || !settings.whatsappServerUrl) return;
            const MENSAGENS_WPP = {
                'confirmado': "Olá {nome}! Seu pedido na *{loja}* foi confirmado! 🍕🔥",
                'enviado': "🛵 *Saiu para entrega!* Seu pedido está a caminho, {nome}.",
                'entregue': "Pedido entregue! ✅ Agradecemos a preferência, {nome}."
            };
            let message = MENSAGENS_WPP[statusKey];
            if (!message) return;
            const nome = customerName ? customerName.split(' ')[0] : 'Cliente';
            message = message.replace('{nome}', nome).replace('{loja}', settings.appName || 'Fritzza');
            try {
                Toastify({ text: "Enviando WhatsApp... 📲", duration: 2000, style: { background: "#2563eb" } }).showToast();
                await fetch(settings.whatsappServerUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, message: message })
                });
                Toastify({ text: "WhatsApp Enviado! ✅", duration: 3000, style: { background: "#059669" } }).showToast();
            } catch (e) {
                console.error(e);
            }
        }

        function GlobalModal({ modal, close }) { 
            if (!modal.isOpen) return null; 
            return ( 
                <div className="modal-overlay" onClick={modal.type === 'alert' ? close : undefined}> 
                    <div className="modal-box text-left" onClick={e => e.stopPropagation()}> 
                        <div className={`text-4xl mb-3 text-center ${modal.type === 'error' ? 'text-red-500' : modal.type === 'success' ? 'text-green-500' : 'text-blue-500'}`}> 
                            {modal.type === 'error' ? <i className="fa-solid fa-circle-xmark"></i> : modal.type === 'success' ? <i className="fa-solid fa-circle-check"></i> : <i className="fa-solid fa-circle-info"></i>} 
                        </div> 
                        <h3 className="text-xl font-bold text-gray-800 mb-2 text-center">{modal.title}</h3> 
                        <p className="text-gray-600 text-sm mb-6 text-center">{modal.message}</p> 
                        <div className="flex gap-2 justify-center"> 
                            {modal.type === 'confirm' && <button onClick={close} className="px-4 py-2 border rounded-lg text-gray-600 font-bold hover:bg-gray-50 flex-1">Cancelar</button>} 
                            <button onClick={() => { if(modal.onConfirm) modal.onConfirm(); close(); }} className={`px-4 py-2 rounded-lg text-white font-bold shadow-md flex-1 ${modal.type === 'error' ? 'bg-red-500 hover:bg-red-600' : 'bg-blue-600 hover:bg-blue-700'}`}>{modal.confirmText || 'OK'}</button> 
                        </div> 
                    </div> 
                </div> 
            ); 
        }

        function LoginView({ onLogin, loading, error }) { 
            const [email, setEmail] = useState(""); 
            const [password, setPassword] = useState(""); 
            return ( 
                <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4"> 
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm"> 
                        <div className="text-center mb-6"> 
                            <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-3"><i className="fa-solid fa-shield-halved"></i></div> 
                            <h2 className="text-2xl font-bold text-gray-800">Acesso Restrito</h2> 
                        </div> 
                        <form onSubmit={(e) => { e.preventDefault(); onLogin(email, password); }} className="space-y-4"> 
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Email</label><input type="email" required className="w-full border p-3 rounded-lg outline-none" value={email} onChange={e=>setEmail(e.target.value)} /></div> 
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Senha</label><input type="password" required className="w-full border p-3 rounded-lg outline-none" value={password} onChange={e=>setPassword(e.target.value)} /></div> 
                            {error && <div className="text-red-600 text-sm text-center bg-red-50 p-2 rounded">{error}</div>} 
                            <button type="submit" disabled={loading} className="w-full bg-red-600 text-white py-3 rounded-lg font-bold hover:bg-red-700 transition disabled:opacity-70">{loading ? 'Entrando...' : 'Entrar'}</button> 
                        </form> 
                    </div> 
                </div> 
            ); 
        }

        function AdminIngredients({ ingredients, settings, theme, showAlert, showConfirm, userUid }) { 
            const [data, setData] = useState({ name: "", unit: "kg", cost: "" }); 
            const save = async (e) => { 
                e.preventDefault(); 
                try {
                    const cost = parseFloat(data.cost);
                    if(data.id) { 
                        await getCol('ingredients').doc(data.id).update({...data, cost}); 
                        showAlert("Sucesso", "Atualizado!", "success");
                    } else { 
                        await getCol('ingredients').add({...data, cost}); 
                        showAlert("Sucesso", "Criado!", 'success'); 
                    } 
                    setData({name:"", unit:"kg", cost:""});
                } catch (err) {
                    console.error("Erro completo:", err);
                    showAlert("Erro de Permissão", `Seu UID atual é: ${userUid}. Verifique se ele está EXATAMENTE igual nas regras do Firestore para o caminho /artifacts/rodaodef/...`, "error");
                }
            }; 
            const del = (id) => showConfirm("Excluir", "Apagar?", async () => await getCol('ingredients').doc(id).delete()); 
            return ( 
                <div> 
                    <div className="bg-blue-50 p-2 text-xs text-blue-800 mb-2 border border-blue-200">
                        <b>Teste de Permissão:</b> Tente adicionar um insumo simples (ex: Teste / Kg / 10.00). Se falhar, copie o UID da barra preta.
                    </div>
                    <form onSubmit={save} className="bg-gray-50 p-4 rounded-lg mb-4 border space-y-3"> 
                        <div className="grid grid-cols-3 gap-3"> 
                            <input placeholder="Nome" className="border p-2 rounded" value={data.name} onChange={e=>setData({...data, name:e.target.value})} /> 
                            <select className="border p-2 rounded" value={data.unit} onChange={e=>setData({...data, unit:e.target.value})}><option value="kg">Kg</option><option value="lt">Lt</option><option value="un">Un</option></select> 
                            <input type="number" step="0.01" placeholder="Custo" className="border p-2 rounded" value={data.cost} onChange={e=>setData({...data, cost:e.target.value})} /> 
                        </div> 
                        <button className="w-full text-white px-4 py-2 rounded font-bold" style={theme}>Salvar Insumo</button> 
                    </form> 
                    <div className="space-y-2">{ingredients.map(i => (<div key={i.id} className="flex justify-between border p-3 rounded bg-white items-center"><div><b>{i.name}</b> <span className="text-xs text-gray-500">({i.unit})</span></div><div className="flex gap-3 items-center"><span className="text-green-600 font-bold">{formatMoney(i.cost)}</span><button onClick={()=>setData(i)} className="text-blue-500"><i className="fa-solid fa-pen"></i></button><button onClick={()=>del(i.id)} className="text-red-500"><i className="fa-solid fa-trash"></i></button></div></div>))}</div> 
                </div> 
            ); 
        }

        function AdminDashboard({ theme }) { 
            const [stats, setStats] = useState({ todaySales: 0, todayOrders: 0, avgTicket: 0, pending: 0 }); 
            useEffect(() => { 
                const startOfDay = new Date(); startOfDay.setHours(0,0,0,0); 
                const u = getCol('orders').where('createdAt', '>=', startOfDay.toISOString()).onSnapshot(s => { 
                    let total = 0, count = 0, pending = 0; 
                    s.docs.forEach(d => { const data = d.data(); total += (data.totals?.total || 0); count++; if(data.status === 'pendente' || data.status === 'enviado') pending++; }); 
                    setStats({ todaySales: total, todayOrders: count, avgTicket: count > 0 ? total / count : 0, pending }); 
                }); 
                return () => u(); 
            }, []); 
            return ( <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"> <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500"><div className="text-gray-500 text-sm font-bold uppercase mb-1">Vendas Hoje</div><div className="text-3xl font-bold text-gray-800">{formatMoney(stats.todaySales)}</div></div> <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500"><div className="text-gray-500 text-sm font-bold uppercase mb-1">Pedidos</div><div className="text-3xl font-bold text-gray-800">{stats.todayOrders}</div></div> <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-purple-500"><div className="text-gray-500 text-sm font-bold uppercase mb-1">Ticket Médio</div><div className="text-3xl font-bold text-gray-800">{formatMoney(stats.avgTicket)}</div></div> <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-yellow-500"><div className="text-gray-500 text-sm font-bold uppercase mb-1">Em Aberto</div><div className="text-3xl font-bold text-gray-800">{stats.pending}</div></div> </div> ); 
        }

        function AdminOrders({ showConfirm, settings }) { 
            const [allOrders, setAllOrders] = useState([]);
            const [filter, setFilter] = useState('today');
            useEffect(() => { const u = getCol('orders').orderBy('createdAt', 'desc').limit(100).onSnapshot(s => setAllOrders(s.docs.map(d => ({ id: d.id, ...d.data() })))); return () => u(); }, []);
            const filteredOrders = useMemo(() => {
                const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                if (filter === 'today') return allOrders.filter(o => new Date(o.createdAt) >= today);
                return allOrders;
            }, [filter, allOrders]);
            
            const nextStatus = async (order) => {
                const statusFlow = { 'pendente': 'confirmado', 'confirmado': 'enviado', 'enviado': 'entregue' };
                const newStatus = statusFlow[order.status];
                if(newStatus) {
                    await getCol('orders').doc(order.id).update({ status: newStatus });
                    if (['confirmado', 'enviado', 'entregue'].includes(newStatus) && order.customer?.phone) {
                        sendWhatsAppNotification(order.customer.phone, newStatus, order.customer.name, settings);
                    }
                }
            };
            const del = (id) => showConfirm("Excluir", "Excluir pedido?", async () => await getCol('orders').doc(id).delete()); 

            return (
                <div className="space-y-4">
                    <div className="flex gap-2 bg-gray-50 p-2 rounded-lg border">
                        {['today', 'all'].map(k => <button key={k} onClick={()=>setFilter(k)} className={`px-4 py-1 rounded text-sm font-bold ${filter===k?'bg-gray-800 text-white':'bg-white border'}`}>{k==='today'?'Hoje':'Todos'}</button>)}
                    </div>
                    {filteredOrders.map(x => (
                        <div key={x.id} className={`border p-3 rounded-lg bg-white shadow-sm border-l-4 ${x.status==='pendente'?'border-l-red-500':x.status==='confirmado'?'border-l-blue-500':x.status==='entregue'?'border-l-green-500':'border-l-yellow-500'}`}>
                            <div className="flex justify-between items-start">
                                <div><div className="font-bold text-gray-800 text-lg">{x.customer?.name} #{x.id.slice(-4)}</div><div className="text-xs text-gray-500">{new Date(x.createdAt).toLocaleString()}</div></div>
                                <div className="text-right"><span className="text-green-600 font-bold text-xl block">{formatMoney(x.totals?.total || 0)}</span></div>
                            </div>
                            <div className="mt-2 text-sm">{x.items?.map((i,idx) => (<div key={idx} className="border-b py-1">{i.quantity}x {i.name}</div>))}</div>
                            <div className="mt-3 flex gap-2">
                                <span className="uppercase font-bold px-2 py-1 rounded bg-gray-100 text-xs">{x.status}</span>
                                {x.status !== 'entregue' && <button onClick={()=>nextStatus(x)} className="bg-blue-600 text-white px-3 py-1 rounded font-bold text-xs">Avançar</button>}
                                <button onClick={()=>del(x.id)} className="text-red-500 bg-red-50 px-3 py-1 rounded font-bold text-xs"><i className="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    ))}
                </div>
            ); 
        }

        function AdminProducts({products, categories, ingredients, settings, theme, showAlert, showConfirm}) { 
            const [edit, setEdit] = useState(false); 
            const [data, setData] = useState({name:"", price:"", category:"", imageUrl:"", description:"", recipe: []}); 
            const save = async (e) => { 
                e.preventDefault(); 
                try {
                    const p = {...data, price:parseFloat(data.price)}; 
                    if(data.id) await getCol('products').doc(data.id).update(p); 
                    else await getCol('products').add(p); 
                    setEdit(false); 
                    showAlert("Sucesso", "Salvo!", "success"); 
                } catch(e) { showAlert("Erro", "Erro ao salvar. Verifique permissões.", "error"); }
            }; 
            const del = (id) => showConfirm("Excluir?", "Apagar produto?", async () => await getCol('products').doc(id).delete());
            return ( <div> <button onClick={()=>{setData({name:"", price:"", category:categories[0]?.name||"", recipe: []}); setEdit(true)}} className="text-white px-4 py-2 rounded mb-4 font-bold shadow" style={theme}>+ Produto</button> {edit && <form onSubmit={save} className="bg-gray-50 p-4 rounded-lg mb-4 space-y-3 border"> <input required placeholder="Nome" className="border p-2 rounded w-full" value={data.name} onChange={e=>setData({...data, name:e.target.value})} /> <input type="number" step="0.01" placeholder="Preço (R$)" className="border p-2 rounded w-full" value={data.price} onChange={e=>setData({...data, price:e.target.value})} /> <div className="flex gap-2"><button type="submit" className="flex-1 text-white py-2 rounded font-bold" style={theme}>Salvar</button><button type="button" onClick={()=>setEdit(false)} className="flex-1 border py-2 rounded text-gray-600">Cancelar</button></div> </form>} <div className="grid gap-2"> {products.map(p => ( <div key={p.id} className="flex justify-between items-center border p-3 rounded bg-white shadow-sm"> <div><h4 className="font-bold">{p.name}</h4><div className="font-bold">{formatMoney(p.price)}</div></div> <div className="flex gap-1"> <button onClick={()=>{setData(p);setEdit(true)}} className="text-blue-500 p-2"><i className="fa-solid fa-pen"></i></button> <button onClick={()=>del(p.id)} className="text-red-500 p-2"><i className="fa-solid fa-trash"></i></button> </div> </div> ))} </div> </div> ); 
        }
        
        function AdminConfig(
