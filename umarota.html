<head>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        /* VARIÁVEIS DINÂMICAS: LIMITES AUMENTADOS DRASTICAMENTE */
        :root {
            --cor-tema: #2563eb; 
            --fonte-base: 20px;
            --fonte-titulos: 26px;
            --fonte-botoes: 24px;
            --barra-topo-p: 20px;
            --barra-base-h: 100px;
            --fab-tamanho: 85px; /* FAB Gigante por padrão */
            --card-p: 24px;
            --input-p: 24px;
        }

        /* BLINDAGEM */
        html, body {
            touch-action: pan-y; 
            -webkit-user-select: none; 
            user-select: none; 
            -webkit-touch-callout: none; 
            overscroll-behavior: none; 
        }
        input, textarea {
            -webkit-user-select: auto;
            user-select: auto;
            font-size: 20px !important; /* Previne auto-zoom e melhora leitura */
        }

        /* CLASSES DE TAMANHO */
        .txt-base { font-size: var(--fonte-base) !important; line-height: 1.3 !important; }
        .txt-titulo { font-size: var(--fonte-titulos) !important; line-height: 1.2 !important; }
        .txt-botao { font-size: var(--fonte-botoes) !important; font-weight: 900 !important; }
        .pad-topo { padding: var(--barra-topo-p) !important; }
        .alt-barra-base { height: var(--barra-base-h) !important; }
        .pad-card { padding: var(--card-p) !important; }
        .pad-input { padding: var(--input-p) !important; }
        
        /* BOTÃO FLUTUANTE NO MEIO DA TELA */
        .fab-btn { 
            width: var(--fab-tamanho) !important; 
            height: var(--fab-tamanho) !important; 
            font-size: calc(var(--fab-tamanho) * 0.4) !important; 
        }
        #fabContainer { 
            top: 50% !important; 
            transform: translateY(-50%) !important; 
            right: 15px !important; 
        }
        
        /* O conteúdo principal ganha padding na direita para o FAB não tampar a leitura */
        .area-principal { padding-right: calc(var(--fab-tamanho) + 25px) !important; }

        /* TEMA */
        .bg-tema { background-color: var(--cor-tema) !important; color: white !important; }
        .text-tema { color: var(--cor-tema) !important; }
        .border-tema { border-color: var(--cor-tema) !important; }
        .tab-active { color: var(--cor-tema) !important; }
        .tab-active .icon-bg { background-color: color-mix(in srgb, var(--cor-tema) 15%, transparent); border-radius: 9999px; }
        
        /* MODO ESCURO */
        body.dark-mode { background-color: #0f172a; color: #f8fafc; }
        .dark-mode .card-ui { background-color: #1e293b; border-color: #334155; }
        .dark-mode .texto-secundario { color: #94a3b8; }
        .dark-mode input { background-color: #0f172a !important; border-color: #475569 !important; color: white !important; }
        .dark-mode .bg-slate-50 { background-color: #0f172a !important; }
        .dark-mode .bottom-bar, .dark-mode .top-bar { background-color: #1e293b; border-color: #334155; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 10px 0; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 32px; width: 32px; border-radius: 50%; background: var(--cor-tema); cursor: pointer; margin-top: -12px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 10px; cursor: pointer; background: #cbd5e1; border-radius: 5px; }
    </style>
</head>

        async function processarUmPacote() {
            const input = document.getElementById('enderecoInput');
            const notaInp = document.getElementById('notaInput');
            const val = input.value.trim();
            if(!val) return;
            
            input.disabled = true;
            notaInp.disabled = true;

            const ruaBase = extrairNomeRua(val);
            const rConhecida = dicionarioRuas[ruaBase];
            const cExata = dicionarioEnderecosExatos[padronizarTexto(val)];

            let endFinal = val; 
            let nota = "-";
            
            if (cExata) {
                if (cExata.plusCode) endFinal = cExata.plusCode;
                if (cExata.notas) nota = cExata.notas;
            } else {
                let achouAproximado = false;
                const matchNum = val.match(/\d+/);
                
                if (matchNum && dicionarioAproximados[ruaBase]) {
                    const numDigitado = parseInt(matchNum[0]);
                    const numerosMapeados = Object.keys(dicionarioAproximados[ruaBase]);
                    
                    for (let numMapeado of numerosMapeados) {
                        if (Math.abs(numDigitado - parseInt(numMapeado)) <= 100) {
                            endFinal = dicionarioAproximados[ruaBase][numMapeado].plusCode;
                            nota = `Loc. APROX. (${val})`; 
                            achouAproximado = true;
                            break;
                        }
                    }
                }

                if (!achouAproximado) {
                    const temPlusCodeNaRua = dicionarioAproximados[ruaBase] || 
                                            Object.keys(dicionarioEnderecosExatos).some(key => extrairNomeRua(key) === ruaBase);
                    
                    if (temPlusCodeNaRua) { nota = "Alerta. PlusCode Possivel"; }
                }
            }

            const notaAvulsa = notaInp.value.trim();
            if (notaAvulsa) { nota = nota !== "-" ? `${nota} | ${notaAvulsa}` : notaAvulsa; }

            const item = {
                "Display ID": `${operadorAtual}${meuContador}`,
                "Destination Address": endFinal,
                "City": "-",
                "Notas": nota,
                "_ruaBase": ruaBase,
                "_status": modoTrabalho === 'uma' ? '1' : (rConhecida || 'pendente')
            };

            db.ref(getPathSessao()).push(item);
            db.ref(getPathContador()).set(meuContador + 1);

            input.value = ""; input.disabled = false; input.focus();
            notaInp.value = ""; notaInp.disabled = false;
            document.getElementById('sugestoesDropdown').classList.add('hidden');
        }

        function extrairNomeRua(e) {
            const b = padronizarTexto(e);
            const m = b.match(/^([^0-9]+)/);
            return m ? m[1].trim() : b;
        }

        function padronizarTexto(texto) {
            let l = texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[,.-]/g, ' ');
            const d = {'\\b(rua|r)\\b':'','\\b(avenida|av|ave)\\b':'','\\b(travessa|tv|trav)\\b':''};
            for (let r in d) l = l.replace(new RegExp(r, 'g'), d[r]);
            return l.replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
        }

        function selecionarSugestaoMapbox(nome, lng, lat) {
            const input = document.getElementById('enderecoInput');
            const numDigitado = input.value.match(/\d+/);
            if (numDigitado && !nome.match(/\d+/)) {
                let partes = nome.split(',');
                partes[0] = partes[0] + " " + numDigitado[0];
                nome = partes.join(',');
            }
            input.value = nome;
            document.getElementById('sugestoesDropdown').classList.add('hidden');
            map.setView([lat, lng], 17);
            marker.setLatLng([lat, lng]).setOpacity(1);
        }

        async function verNoMapa(endereco) {
            try {
                const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(endereco)}.json?access_token=${mbt}&country=br&limit=1`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.features && data.features.length > 0) {
                    const [lng, lat] = data.features[0].center;
                    map.setView([lat, lng], 16);
                    marker.setLatLng([lat, lng]).setOpacity(1);
                }
            } catch (e) { console.error(e); }
        }

        async function baixarPlanilha(dados, nome) {
            if (dados.length === 0) { alert("Rota vazia!"); return; }
            const dl = dados.map(item => ({ "ID Pacote": item["Display ID"], "Notes": item.Notas || "-", "City": item["City"] || "Cafelândia", "Destination Address": item["Destination Address"] }));
            const ws = XLSX.utils.json_to_sheet(dl);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Entregas");
            try {
                if (navigator.canShare) {
                    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                    const file = new File([wbout], nome, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({ title: 'Rota ' + nome, text: 'Planilha pronta', files: [file] });
                        return; 
                    }
                }
            } catch (e) { console.log("Compartilhamento cancelado:", e); }
            XLSX.writeFile(wb, nome);
        }

        function salvarCorrecaoExata() {
            const o = document.getElementById('memEndOriginal').value;
            const p = document.getElementById('memPlusCode').value;
            const n = document.getElementById('memNotas').value;
            const isAproximado = document.getElementById('memAproximado').checked;
            if(!o) return;
            dbEnderecosExatos.child(padronizarTexto(o)).set({ plusCode: p, notas: n });
            if (isAproximado) {
                const ruaBase = extrairNomeRua(o);
                const matchNum = o.match(/\d+/);
                if (matchNum) { dbAproximados.child(ruaBase).child(matchNum[0]).set({ plusCode: p, enderecoBase: o }); } 
                else { alert("⚠️ O endereço precisa de um número para aproximação."); return; }
            }
            alert("Salvo com sucesso!");
            document.getElementById('memEndOriginal').value = '';
            document.getElementById('memPlusCode').value = '';
            document.getElementById('memNotas').value = '';
            document.getElementById('memAproximado').checked = false;
        }

        function iniciarReconhecimentoVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Microfone não suportado. Use o Google Chrome no celular."); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            const fabMic = document.getElementById('fabMic');
            const inputEnd = document.getElementById('enderecoInput');
            
            fabMic.classList.replace('bg-tema', 'bg-rose-500');
            fabMic.classList.add('animate-pulse');
            inputEnd.placeholder = "Ouvindo...";

            recognition.start();

            recognition.onresult = async (event) => {
                const termoFalado = event.results[0][0].transcript;
                inputEnd.value = termoFalado;
                fabMic.classList.replace('bg-rose-500', 'bg-tema');
                fabMic.classList.remove('animate-pulse');
                inputEnd.placeholder = "Buscando...";

                try {
                    const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(termoFalado)}.json?access_token=${mbt}&country=br&bbox=-54.5,-26.0,-52.4,-24.0&proximity=-53.45,-24.95&types=address,poi&limit=1`;
                    const res = await fetch(url);
                    const data = await res.json();
                    if(data.features && data.features.length > 0) {
                        const f = data.features[0];
                        selecionarSugestaoMapbox(f.place_name.replace(/'/g, "\\'"), f.center[0], f.center[1]);
                    } else { alert("Não achei nada próximo com esse áudio: " + termoFalado); }
                } catch(e) { console.error("Erro voz:", e); }
                inputEnd.placeholder = "Rua e número...";
            };

            recognition.onerror = () => {
                fabMic.classList.replace('bg-rose-500', 'bg-tema');
                fabMic.classList.remove('animate-pulse');
                inputEnd.placeholder = "Rua e número...";
            };
            
            recognition.onend = () => {
                fabMic.classList.replace('bg-rose-500', 'bg-tema');
                fabMic.classList.remove('animate-pulse');
                if(inputEnd.placeholder === "Ouvindo...") inputEnd.placeholder = "Rua e número...";
            };
        }
