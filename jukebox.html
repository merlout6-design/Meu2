<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jukebox Gedasko Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --bg-card: #181818;
            --bg-hover: #282828;
            --primary: #D81B60;
            --text-main: #FFFFFF;
            --text-muted: #B3B3B3;
            --like: #1DB954; 
            --dislike: #E91E63; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
            max-width: 600px;
            margin: 0 auto;
        }

        #statusConexao {
            text-align: center; font-size: 13px; font-weight: 600; padding: 8px; 
            background-color: #331111; color: #ffbaba; transition: 0.5s;
            position: sticky; top: 0; z-index: 200;
        }
        .conectado { background-color: #113311 !important; color: #baffba !important; }

        header {
            background: linear-gradient(180deg, rgba(216,27,96,0.3) 0%, rgba(18,18,18,1) 100%);
            padding: 40px 20px 20px; text-align: center;
        }
        header h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        header p { color: var(--text-muted); font-size: 16px; }

        .search-container { padding: 0 20px; margin-top: 15px; position: sticky; top: 35px; z-index: 100; }
        .search-box {
            background-color: #242424; border-radius: 50px; display: flex;
            align-items: center; padding: 16px 20px; border: 2px solid transparent; transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--primary); }
        .search-box input {
            background: transparent; border: none; color: white; font-size: 18px;
            width: 100%; outline: none; margin-left: 12px;
        }

        .section-title { padding: 30px 20px 20px; font-size: 22px; font-weight: 700; }

        .resultados-grid { padding: 0 20px; display: flex; flex-direction: column; gap: 15px; }
        .track-card {
            display: flex; align-items: center; background-color: var(--bg-card);
            border-radius: 12px; padding: 12px; cursor: pointer;
        }
        .track-card img { width: 60px; height: 60px; border-radius: 6px; margin-right: 15px; }
        .track-info { flex: 1; overflow: hidden; }
        .track-title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 15px; color: var(--text-muted); }
        .add-btn {
            border: 2px solid var(--text-muted); color: white; width: 38px; height: 38px;
            border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center;
        }

        .fila-container { padding: 0 20px; min-height: 400px; }
        .fila-item {
            display: flex; align-items: center; margin-bottom: 16px;
            background-color: rgba(24, 24, 24, 0.6); padding: 12px; border-radius: 12px;
        }
        .fila-item img { width: 55px; height: 55px; border-radius: 50%; margin-right: 15px; }
        
        .vote-container {
            display: flex; flex-direction: column; align-items: center; gap: 8px; margin-left: 10px;
        }
        .vote-group { display: flex; align-items: center; gap: 10px; }
        .vote-btn {
            background: #333; border: none; color: white; border-radius: 8px;
            padding: 8px 12px; font-size: 14px; font-weight: bold; display: flex;
            align-items: center; gap: 5px; cursor: pointer; transition: 0.2s;
        }
        
        /* Efeitos visuais do botão */
        .vote-btn:not(:disabled):active { transform: scale(1.1); }
        .vote-btn.like:not(:disabled):hover { background: #2b7a42; }
        .vote-btn.dislike:not(:disabled):hover { background: #9c1543; }
        
        /* Classes para quando a pessoa já votou */
        .vote-btn.voted-like { background: var(--like); opacity: 1; border: 1px solid #fff; cursor: default; }
        .vote-btn.voted-dislike { background: var(--dislike); opacity: 1; border: 1px solid #fff; cursor: default; }
        .vote-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .count { font-size: 14px; }

        .pagination { display: flex; justify-content: center; gap: 10px; padding: 20px; }
        .page-btn {
            background-color: #242424; color: white; border: none;
            width: 45px; height: 45px; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer;
        }
        .page-btn.active { background-color: var(--primary); box-shadow: 0 4px 10px rgba(216,27,96,0.4); }

        .loader { text-align: center; color: var(--text-muted); padding: 25px; display: none; }
        
        #toast {
            position: fixed; bottom: -80px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; padding: 16px 30px;
            border-radius: 50px; font-weight: 600; transition: 0.4s; z-index: 1000; text-align: center; white-space: nowrap;
        }
        #toast.show { bottom: 40px; }
        #toast.error { background: #ff9800; color: #000; } /* Cor diferente para erros/avisos */
    </style>
</head>
<body>

    <div id="statusConexao">🔴 Offline</div>

    <header>
        <h1>🎵 Jukebox Gedasko</h1>
        <p>A trilha sonora da sorveteria é você quem faz!</p>
    </header>

    <div class="search-container">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Qual música quer ouvir?" autocomplete="off">
        </div>
    </div>

    <div id="resultadosSection" style="display: none;">
        <h2 class="section-title">Resultados da Pesquisa</h2>
        <div id="loader" class="loader">Buscando músicas... ⏳</div>
        <div class="resultados-grid" id="resultadosGrid"></div>
    </div>

    <div>
        <h2 class="section-title">Últimos Pedidos 🎧</h2>
        <div class="fila-container" id="filaContainer">
            <p style="color: gray; font-size: 16px; text-align: center; padding-top: 20px;">Carregando pedidos...</p>
        </div>
        <div id="pagination" class="pagination"></div>
    </div>

    <div id="toast">Mensagem Padrão</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, limitToLast, update, increment } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://frizza2-79ec2-default-rtdb.firebaseio.com/" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const statusEl = document.getElementById('statusConexao');
        onValue(ref(db, '.info/connected'), (snap) => {
            if (snap.val() === true) {
                statusEl.innerText = "🟢 Conectado";
                statusEl.classList.add("conectado");
                setTimeout(() => { statusEl.style.display = 'none'; }, 2000);
            } else {
                statusEl.style.display = 'block';
                statusEl.innerText = "🔴 Reconectando...";
                statusEl.classList.remove("conectado");
            }
        });

        const searchInput = document.getElementById('searchInput');
        const resultadosGrid = document.getElementById('resultadosGrid');
        const resultadosSection = document.getElementById('resultadosSection');
        const loader = document.getElementById('loader');
        const toast = document.getElementById('toast');
        const filaContainer = document.getElementById('filaContainer');
        const paginationContainer = document.getElementById('pagination');

        let debounceTimer;
        let historicoGlobal = [];
        let votosGlobais = {}; 
        let paginaAtual = 1;
        const itensPorPagina = 5;

        function gerarChaveMusica(artista, titulo) {
            return `${artista}_${titulo}`.toLowerCase().replace(/[^a-z0-9]/gi, '_');
        }

        searchInput.addEventListener('input', (e) => {
            const termo = e.target.value.trim();
            clearTimeout(debounceTimer);
            if(termo === '') { resultadosSection.style.display = 'none'; return; }
            resultadosSection.style.display = 'block';
            loader.style.display = 'block';
            resultadosGrid.innerHTML = '';

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(termo)}&entity=song&limit=6`);
                    const data = await res.json();
                    renderizarResultados(data.results);
                } catch (error) { loader.innerText = "Erro ao buscar música."; }
            }, 600);
        });

        function renderizarResultados(musicas) {
            loader.style.display = 'none';
            resultadosGrid.innerHTML = '';
            musicas.forEach(musica => {
                const imagem = musica.artworkUrl100.replace('100x100', '150x150');
                const titulo = musica.trackName;
                const artista = musica.artistName;
                const card = document.createElement('div');
                card.className = 'track-card';
                card.innerHTML = `
                    <img src="${imagem}">
                    <div class="track-info">
                        <div class="track-title">${titulo}</div>
                        <div class="track-artist">${artista}</div>
                    </div>
                    <div class="add-btn">+</div>
                `;
                card.onclick = () => enviarPedido(titulo, artista, imagem);
                resultadosGrid.appendChild(card);
            });
        }

        function enviarPedido(titulo, artista, imagemUrl) {
            const songId = gerarChaveMusica(artista, titulo);
            push(ref(db, 'pedidos_jukebox'), { busca: `${titulo} ${artista}` });
            push(ref(db, 'historico_jukebox'), {
                titulo: titulo, artista: artista, imagem: imagemUrl, 
                songId: songId, timestamp: Date.now()
            });
            mostrarToast("✅ Música adicionada à fila!", "success");
            searchInput.value = '';
            resultadosSection.style.display = 'none';
        }

        // Função do Toast melhorada para aceitar mensagens diferentes
        function mostrarToast(mensagem, tipo) {
            toast.innerText = mensagem;
            if (tipo === "error") {
                toast.classList.add('error');
            } else {
                toast.classList.remove('error');
            }
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        onValue(ref(db, 'votos_musicas'), (snapshot) => {
            votosGlobais = snapshot.val() || {};
            renderizarPaginaHistorico(); 
        });

        const historicoRef = query(ref(db, 'historico_jukebox'), limitToLast(25));
        onValue(historicoRef, (snapshot) => {
            if (snapshot.exists()) {
                const arrayTemporario = [];
                snapshot.forEach(child => { 
                    const data = child.val();
                    if(!data.songId) data.songId = gerarChaveMusica(data.artista, data.titulo);
                    arrayTemporario.push(data); 
                });
                historicoGlobal = arrayTemporario.reverse(); 
                renderizarPaginaHistorico();
                renderizarBotoesPaginacao();
            } else {
                filaContainer.innerHTML = '<p style="color: gray; font-size: 16px; text-align: center; padding-top: 20px;">Nenhum pedido recente.</p>';
            }
        });

        // --- SISTEMA DE VOTAÇÃO COM BLOQUEIO ---
        window.votarNoItem = function(songId, tipo) {
            // Verifica se no celular da pessoa já existe o registro de voto dessa música
            const votoAnterior = localStorage.getItem('voto_gedasko_' + songId);

            if (votoAnterior) {
                mostrarToast("Você já votou nessa música! 😅", "error");
                return; // Para a execução da função aqui, não envia para o Firebase
            }

            // Grava no celular da pessoa que ela acabou de votar
            localStorage.setItem('voto_gedasko_' + songId, tipo);

            // Envia o voto para o Firebase
            const updates = {};
            updates[`votos_musicas/${songId}/${tipo}`] = increment(1);
            update(ref(db), updates);
            
            // Força a atualização da tela para mostrar o botão pintado
            renderizarPaginaHistorico();
        };

        function renderizarPaginaHistorico() {
            if (historicoGlobal.length === 0) return;
            filaContainer.innerHTML = '';
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const itensDaPagina = historicoGlobal.slice(inicio, fim);

            itensDaPagina.forEach(item => {
                const votos = votosGlobais[item.songId] || { likes: 0, dislikes: 0 };
                
                // Lê a memória do celular para saber se essa música já foi votada neste aparelho
                const meuVoto = localStorage.getItem('voto_gedasko_' + item.songId);
                
                // Define as classes CSS dependendo se a pessoa votou ou não
                const classLike = meuVoto === 'likes' ? 'voted-like' : '';
                const classDislike = meuVoto === 'dislikes' ? 'voted-dislike' : '';
                const desativarBotoes = meuVoto ? 'disabled' : '';

                const div = document.createElement('div');
                div.className = 'fila-item';
                div.innerHTML = `
                    <img src="${item.imagem}">
                    <div class="track-info">
                        <div class="track-title">${item.titulo}</div>
                        <div class="track-artist">${item.artista}</div>
                    </div>
                    <div class="vote-container">
                        <div class="vote-group">
                            <button class="vote-btn like ${classLike}" onclick="window.votarNoItem('${item.songId}', 'likes')" ${desativarBotoes}>
                                ❤️ <span class="count">${votos.likes || 0}</span>
                            </button>
                            <button class="vote-btn dislike ${classDislike}" onclick="window.votarNoItem('${item.songId}', 'dislikes')" ${desativarBotoes}>
                                👎 <span class="count">${votos.dislikes || 0}</span>
                            </button>
                        </div>
                    </div>
                `;
                filaContainer.appendChild(div);
            });
        }

        function renderizarBotoesPaginacao() {
            paginationContainer.innerHTML = '';
            const totalPaginas = Math.ceil(historicoGlobal.length / itensPorPagina);
            if (totalPaginas <= 1) return;
            for (let i = 1; i <= totalPaginas; i++) {
                const btn = document.createElement('button');
                btn.className = 'page-btn' + (i === paginaAtual ? ' active' : '');
                btn.innerText = i;
                btn.onclick = () => {
                    paginaAtual = i;
                    renderizarPaginaHistorico();
                    renderizarBotoesPaginacao();
                };
                paginationContainer.appendChild(btn);
            }
        }
    </script>
</body>
</html>
