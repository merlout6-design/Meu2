<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processador Cloud - Rotas Circuit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .loader { border-top-color: #4f46e5; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-indigo-700 p-6 text-white">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fas fa-cloud text-indigo-300"></i>
                    Processador Cloud + Mapbox
                </h1>
                <div class="flex items-center gap-2">
                    <span id="cloudStatus" class="flex items-center gap-1 text-xs bg-indigo-800/50 px-2 py-1 rounded-full text-indigo-200">
                        <i class="fas fa-circle-notch fa-spin"></i> Conectando...
                    </span>
                    <span class="bg-indigo-900 px-3 py-1 rounded-full text-xs font-mono border border-indigo-500/30">v6.7</span>
                </div>
            </div>
            <p class="text-indigo-200 text-sm mt-2">Validação Inteligente de CEP (Regex Avançada)</p>
        </div>

        <div class="p-6 space-y-6">
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">CEP Alvo (Opcional)</label>
                <input type="text" id="cepAlvo" placeholder="Ex: 85817 (Deixe vazio para ignorar)" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">JSON Estruturado (Cole o retorno do Gemini)</label>
                <textarea id="jsonInput" rows="6" placeholder='[{"rua": "Exemplo", "numero": "123", ...}]' class="w-full border border-slate-300 rounded-xl p-4 text-sm font-mono bg-white focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-inner"></textarea>
            </div>

            <button onclick="window.processarFila()" id="btnProcessar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-md active:scale-[0.98] flex items-center justify-center gap-2">
                <i class="fas fa-magic"></i> Processar Endereços
            </button>

            <div id="statusArea" class="hidden">
                <div class="flex items-center justify-between mb-2">
                    <span id="progressText" class="text-sm font-medium text-slate-600">Validando rotas...</span>
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-5 w-5"></div>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                    <div id="progressBar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
            
            <div id="resultsContainer" class="hidden space-y-6 pt-4 border-t border-slate-200">
                <div class="flex items-center justify-between pb-2 border-b border-slate-200 mb-3">
                    <h3 class="font-bold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-list-check text-indigo-500"></i> Endereços Ordenados (Prioridade ⬆)
                    </h3>
                    <span id="countLabel" class="text-xs bg-slate-200 px-3 py-1 rounded-full font-bold text-slate-700">0 itens</span>
                </div>
                <ul id="resultsList" class="space-y-3 max-h-[500px] overflow-y-auto pr-2 pb-2"></ul>
                
                <button onclick="window.exportarCSV()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-md active:scale-[0.98] flex items-center justify-center gap-2 mt-4">
                    <i class="fas fa-file-csv text-xl"></i> Baixar Planilha
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup
        const firebaseConfig = { apiKey: "AIzaSyDkVx0C_d9iAKdq6Ip22p4qQ6RYDhZvk-s", projectId: "rodao-f93c2", appId: "1:867137990526:web:833eed12a9c2e50c9a0d2f" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        signInAnonymously(auth);

        // Regex Flexível para CEP (Pega 5 dígitos ou 8 com traço)
        const CEP_REGEX = /\b\d{5}(?:-\d{3})?\b/;

        window.processarFila = async function() {
            const token = "pk.eyJ1IjoibWVybG91dCIsImEiOiJjbW8xeGV1YWwwcDQwMnBva242ZTJ0cmI5In0.SpwaxXYyWY25zIwVKdtT2w";
            const jsonRaw = document.getElementById('jsonInput').value.trim();
            const cepAlvo = document.getElementById('cepAlvo').value.trim().replace(/\D/g, '');
            
            if (!jsonRaw) return alert("Cole o JSON.");
            
            const dados = JSON.parse(jsonRaw);
            const btn = document.getElementById('btnProcessar');
            window.enderecosFinais = [];

            btn.disabled = true;
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('resultsList').innerHTML = '';

            for (let i = 0; i < dados.length; i++) {
                const item = dados[i];
                
                // Busca Mapbox
                const geoResult = await consultarMapbox(item.query_mapbox, token);
                let enderecoValidado = geoResult || `${item.rua}, ${item.numero}, ${item.bairro}`;
                
                // EXTRAÇÃO INTELIGENTE DE CEP
                let cepEncontrado = "";
                const match = enderecoValidado.match(CEP_REGEX);
                if (match) {
                    cepEncontrado = match[0].replace('-', '');
                }

                // DEFINIÇÃO DE PRIORIDADE PARA ORDENAÇÃO
                // 2 = Erro (CEP incompatível)
                // 1 = Alerta (Sem CEP)
                // 0 = OK
                let prioridade = 0;
                let aviso = "";

                if (cepAlvo && cepEncontrado && !cepEncontrado.startsWith(cepAlvo)) {
                    prioridade = 2;
                    aviso = "CEP Divergente";
                } else if (!cepEncontrado) {
                    prioridade = 1;
                    aviso = "Sem CEP";
                }

                window.enderecosFinais.push({
                    id: `item_${Date.now()}_${i}`,
                    address: enderecoValidado,
                    postal_code: cepEncontrado || "S/ CEP",
                    prioridade: prioridade,
                    aviso: aviso
                });
            }

            // ORDENAÇÃO: Prioridade alta (2) primeiro, depois (1), depois (0)
            window.enderecosFinais.sort((a, b) => b.prioridade - a.prioridade);
            window.enderecosFinais.forEach(renderizar);

            document.getElementById('statusArea').classList.add('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');
            document.getElementById('countLabel').innerText = `${window.enderecosFinais.length} itens`;
            btn.disabled = false;
        };

        async function consultarMapbox(query, token) {
            const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${token}&country=BR&language=pt&types=address`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.features?.[0] ? data.features[0].place_name : null;
            } catch { return null; }
        }

        function renderizar(row) {
            const list = document.getElementById('resultsList');
            const li = document.createElement('li');
            
            let color = "bg-slate-50 border-slate-200";
            let textColor = "text-slate-800";
            
            if (row.prioridade === 2) { color = "bg-red-50 border-red-300"; textColor = "text-red-900"; }
            else if (row.prioridade === 1) { color = "bg-orange-50 border-orange-300"; textColor = "text-orange-900"; }

            li.className = `p-3 border rounded-xl shadow-sm ${color}`;
            li.innerHTML = `
                <div class="flex items-start justify-between">
                    <div class="${textColor} font-bold text-sm leading-tight">${row.address}</div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase ${row.prioridade > 0 ? 'bg-white' : 'bg-slate-200'}">${row.postal_code}</span>
                </div>
                ${row.aviso ? `<div class="text-[10px] font-black text-red-600 mt-1 uppercase">⚠️ ${row.aviso}</div>` : ''}
            `;
            list.appendChild(li);
        }

        window.exportarCSV = function() {
            let csv = "Address,CEP\n";
            window.enderecosFinais.forEach(r => csv += `"${r.address}","${r.postal_code}"\n`);
            const link = document.createElement("a");
            link.href = "data:text/csv;charset=utf-8,\uFEFF" + encodeURI(csv);
            link.download = "lista_ordenada.csv";
            link.click();
        };
    </script>
</body>
</html>
