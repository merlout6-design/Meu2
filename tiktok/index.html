<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Roteirizador Cloud PRO Mobile</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Roteirizador">
    <link rel="apple-touch-icon" href="./icone-192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    
    <style>
        /* VARIÁVEIS DINÂMICAS PARA TUDO (Cores e Tamanhos) */
        :root {
            --cor-tema: #2563eb; 
            --fonte-base: 16px;
            --fonte-titulos: 20px;
            --fonte-botoes: 18px;
            --barra-topo-p: 16px;
            --barra-base-h: 80px;
            --fab-tamanho: 64px;
            --card-p: 20px;
            --input-p: 16px;
        }

        /* BLINDAGEM DE APP NATIVO */
        html, body {
            touch-action: pan-y; 
            -webkit-user-select: none; 
            user-select: none; 
            -webkit-touch-callout: none; 
            overscroll-behavior: none; 
        }
        input, textarea {
            -webkit-user-select: auto;
            user-select: auto;
            font-size: 16px !important; 
        }

        /* CLASSES DE TAMANHO PERSONALIZÁVEIS (Sobrescrevem o Tailwind) */
        .txt-base { font-size: var(--fonte-base) !important; }
        .txt-titulo { font-size: var(--fonte-titulos) !important; }
        .txt-botao { font-size: var(--fonte-botoes) !important; }
        .pad-topo { padding: var(--barra-topo-p) !important; }
        .alt-barra-base { height: var(--barra-base-h) !important; }
        .pad-card { padding: var(--card-p) !important; }
        .pad-input { padding: var(--input-p) !important; }
        
        .fab-btn { 
            width: var(--fab-tamanho) !important; 
            height: var(--fab-tamanho) !important; 
            font-size: calc(var(--fab-tamanho) * 0.4) !important; 
        }
        /* Ajusta a altura flutuante para o centro direito da tela */
        #fabContainer { top: 50% !important; transform: translateY(-50%) !important; }

        /* CLASSES DO TEMA DE COR */
        .bg-tema { background-color: var(--cor-tema) !important; color: white !important; }
        .text-tema { color: var(--cor-tema) !important; }
        .border-tema { border-color: var(--cor-tema) !important; }
        .tab-active { color: var(--cor-tema) !important; }
        .tab-active .icon-bg { background-color: color-mix(in srgb, var(--cor-tema) 15%, transparent); border-radius: 9999px; }
        
        /* MODO ESCURO */
        body.dark-mode { background-color: #0f172a; color: #f8fafc; }
        .dark-mode .card-ui { background-color: #1e293b; border-color: #334155; }
        .dark-mode .texto-secundario { color: #94a3b8; }
        .dark-mode input { background-color: #0f172a !important; border-color: #475569 !important; color: white !important; }
        .dark-mode .bg-slate-50 { background-color: #0f172a !important; }
        .dark-mode .bottom-bar, .dark-mode .top-bar { background-color: #1e293b; border-color: #334155; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark-mode ::-webkit-scrollbar-thumb { background: #475569; }

        /* Estilização dos Sliders (Para ficar bonito no app) */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: var(--cor-tema); cursor: pointer; margin-top: -8px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: #cbd5e1; border-radius: 4px; }
        .dark-mode input[type=range]::-webkit-slider-runnable-track { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-24 txt-base transition-colors duration-300"> 

    <div id="loginOverlay" class="fixed inset-0 bg-slate-900 flex flex-col items-center justify-center z-[100] px-6">
        <h1 class="font-black text-white mb-2 text-center tracking-tight" style="font-size: calc(var(--fonte-titulos) + 12px)">Roteirizador PRO</h1>
        <p class="text-slate-400 mb-10 font-medium text-center txt-base" id="loginSubtitulo">Selecione o modo de operação</p>
        
        <div id="etapaModo" class="flex flex-col gap-5 w-full max-w-sm">
            <button onclick="selecionarModo('uma')" class="w-full bg-tema hover:opacity-90 font-bold py-6 rounded-2xl shadow-lg transition active:scale-95 txt-botao">1 Rota</button>
            <button onclick="selecionarModo('duas')" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-6 rounded-2xl shadow-lg transition active:scale-95 txt-botao">2 Rotas</button>
        </div>

        <div id="etapaOperador" class="hidden flex flex-col gap-5 w-full max-w-sm">

            <button onclick="selecionarOperador('B')" class="w-full bg-slate-700 text-white font-bold py-6 rounded-2xl shadow-lg active:scale-95 txt-botao">Operador B</button>
        </div>

       <div id="etapaSessao" class="hidden flex flex-col items-center gap-4 w-full max-w-sm">
    <input type="text" id="inputNomeSessao" class="rounded-2xl w-full outline-none border-4 border-tema uppercase font-bold text-center text-slate-800 pad-input txt-titulo" placeholder="NOME DA MOTO/ROTA">
    
    <div class="w-full bg-slate-800 p-4 rounded-2xl border border-slate-700 text-left">
        <label class="text-slate-400 font-bold text-sm mb-1 block uppercase">Área de Entrega</label>
        <input type="text" id="inputCidade" value="Cascavel, PR" class="w-full bg-slate-900 border-none rounded-xl text-white outline-none focus:ring-2 focus:ring-tema pad-input txt-base mb-3" placeholder="Cidade (ex: Cascavel, PR)">
        
        <div class="flex items-center gap-3">
            <span class="text-slate-400 font-bold text-sm uppercase">Raio:</span>
            <input type="range" id="inputRaio" min="5" max="100" value="10" class="flex-1 accent-tema" oninput="document.getElementById('raioLabel').innerText = this.value + 'km'">
            <span id="raioLabel" class="font-bold text-tema w-12 text-right txt-base">10km</span>
        </div>
    </div>

    <div class="w-full bg-slate-800 p-4 rounded-2xl border border-slate-700 text-left">
        <label class="text-slate-400 font-bold text-sm mb-1 block uppercase">Filtro de CEP (Opcional)</label>
        <input type="text" id="inputCepRestricao" class="w-full bg-slate-900 border-none rounded-xl text-white outline-none focus:ring-2 focus:ring-tema pad-input txt-base" placeholder="Ex: 85801 (Vazio = Sem filtro)">
        <p class="text-xs text-slate-500 mt-2 font-medium">Avisa se o pacote for de outra região.</p>
    </div>
    <button onclick="configurarEFinalizarLogin()" class="bg-tema font-bold py-5 w-full rounded-2xl shadow-lg active:scale-95 txt-botao mt-2">INICIAR OPERAÇÃO</button>
			
			<div class="w-full mt-2 bg-slate-800 rounded-2xl text-left border border-slate-700 pad-card">
				<h3 class="text-tema font-bold mb-4 uppercase tracking-widest flex justify-between txt-base">
					<span class="text-white">Rotas de Hoje</span>
					<span class="text-slate-400" id="dataHojeDisplay"></span>
				</h3>
				<div id="listaSessoesAtivas" class="space-y-3 max-h-48 overflow-y-auto pr-1"></div>
			</div>
		</div>
        
        <button onclick="resetLogin()" id="btnVoltarLogin" class="hidden mt-8 text-slate-400 font-bold active:text-white py-3 px-6 txt-botao">← Voltar</button>
    </div>

    <div class="top-bar bg-white sticky top-0 z-40 border-b shadow-sm pad-topo flex justify-between items-center transition-colors duration-300">
        <div>
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
                <h1 class="font-black uppercase leading-none txt-titulo">Painel</h1>
            </div>
            <p class="texto-secundario font-bold mt-1.5 uppercase txt-base" style="font-size: 0.8em !important">
                <span id="tagOperador" class="text-tema"></span> • <span id="tagModo"></span> • <span id="tagSessao"></span>
            </p>
        </div>
        <div class="flex gap-3">
            <button onclick="abrirConfiguracoes()" class="w-12 h-12 flex justify-center items-center bg-slate-100 card-ui rounded-full active:scale-95 txt-titulo">⚙️</button>
            <button onclick="reiniciarDia()" class="w-12 h-12 flex justify-center items-center bg-rose-50 text-rose-600 border border-rose-200 rounded-full active:scale-95 txt-titulo">🔄</button>
        </div>
    </div>

    <div class="p-4 max-w-lg mx-auto pb-6">
        
        <div id="aba-triagem" class="space-y-5">
            <div class="card-ui bg-white rounded-2xl shadow-sm border border-slate-200 pad-card transition-colors duration-300">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="texto-secundario font-bold uppercase txt-base">Entrada de Pacote</h2>
                    <span id="nextIdDisplay" class="font-black text-tema bg-slate-100 card-ui px-4 py-1.5 rounded-lg txt-titulo"></span>
                </div>
                <div class="flex flex-col gap-4 relative">
                    <div class="flex gap-2">
                        <div class="relative flex-grow flex items-center">
                            <input type="text" id="enderecoInput" class="w-full pr-14 bg-slate-50 border border-slate-300 rounded-xl font-medium outline-none focus:border-tema focus:ring-2 focus:ring-tema transition pad-input txt-base" autocomplete="off" placeholder="Rua e número...">
                            <button onclick="iniciarReconhecimentoVoz()" id="btnMic" class="absolute right-2 texto-secundario p-3 rounded-full active:bg-slate-200 transition txt-titulo">🎤</button>
                            <div id="sugestoesDropdown" class="card-ui hidden absolute left-0 right-0 top-[105%] bg-white border rounded-xl shadow-xl z-50 max-h-60 overflow-y-auto"></div>
                        </div>
                    </div>
                    <input type="text" id="notaInput" class="w-full bg-yellow-50/50 border border-yellow-200 rounded-xl font-medium outline-none focus:border-yellow-400 placeholder-yellow-600/50 pad-input txt-base" autocomplete="off" placeholder="Nota avulsa (opcional)...">
                </div>
            </div>

            <div id="map" class="w-full h-56 rounded-2xl shadow-sm border border-slate-200 z-0"></div>

            <div class="card-ui bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col pad-card transition-colors duration-300">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="texto-secundario font-bold uppercase txt-base" id="tituloLateral">Pendentes</h3>
                    <span id="countPendentes" class="bg-slate-100 texto-secundario px-3 py-1 rounded-full font-bold txt-base">0</span>
                </div>
                <div id="listaPendentes" class="space-y-3"></div> 
            </div>
        </div>

        <div id="aba-listagem" class="hidden space-y-5">
            <div class="card-ui bg-white rounded-2xl shadow-sm border border-slate-200 pad-card transition-colors duration-300">
                <div class="flex justify-between items-center mb-4 border-b pb-3 border-slate-200">
                    <h3 class="font-bold text-tema uppercase txt-titulo" id="labelR1">Rota 1</h3>
                    <button onclick="baixarPlanilha(rota1, 'Rota_1.xlsx')" class="bg-tema text-white px-4 py-2 rounded-lg font-bold active:opacity-80 flex items-center gap-2 txt-base">⬇️ Excel</button>
                </div>
                <div id="fullRota1" class="space-y-3 txt-base"></div>
            </div>
            
            <div id="colunaRota2" class="card-ui bg-white rounded-2xl shadow-sm border border-slate-200 pad-card transition-colors duration-300">
                <div class="flex justify-between items-center mb-4 border-b pb-3 border-slate-200">
                    <h3 class="font-bold text-orange-600 uppercase txt-titulo">Rota 2</h3>
                    <button onclick="baixarPlanilha(rota2, 'Rota_2.xlsx')" class="bg-orange-500 text-white px-4 py-2 rounded-lg font-bold active:opacity-80 flex items-center gap-2 txt-base">⬇️ Excel</button>
                </div>
                <div id="fullRota2" class="space-y-3 txt-base"></div>
            </div>
        </div>

        <div id="aba-ajustes" class="hidden space-y-5">
            <div class="card-ui bg-white rounded-2xl shadow-sm border border-tema relative overflow-hidden pad-card transition-colors duration-300">
                <div class="absolute top-0 left-0 w-1.5 h-full bg-tema"></div>
                <h3 class="font-black mb-5 uppercase tracking-wider flex items-center gap-2 txt-titulo">📍 Plus Code</h3>
                
                <input type="text" id="memEndOriginal" class="w-full bg-slate-50 border rounded-xl mb-4 font-medium outline-none focus:border-tema pad-input txt-base" placeholder="Endereço (ex: Rua Brasil 10)">
                
                <div class="grid grid-cols-1 gap-4 mb-4">
                    <input type="text" id="memPlusCode" class="w-full bg-slate-50 border rounded-xl outline-none focus:border-tema pad-input txt-base" placeholder="Plus Code">
                    <input type="text" id="memNotas" class="w-full bg-slate-50 border rounded-xl outline-none focus:border-tema pad-input txt-base" placeholder="Nota Fixa">
                </div>
                
                <div class="flex items-center mb-5 rounded-xl border border-slate-200 bg-slate-50 pad-input">
                    <input type="checkbox" id="memAproximado" class="w-7 h-7 text-tema bg-white border-slate-300 rounded cursor-pointer">
                    <label for="memAproximado" class="ml-4 font-bold cursor-pointer leading-snug txt-base">
                        Aplicar p/ 100 números próximos
                    </label>
                </div>
                
                <button onclick="salvarCorrecaoExata()" class="w-full bg-tema text-white rounded-xl font-bold shadow-md active:opacity-90 active:scale-95 transition pad-input txt-botao">Salvar Memória</button>
            </div>

            <div class="card-ui bg-white rounded-2xl shadow-sm border border-slate-200 pad-card transition-colors duration-300">
                <h3 class="font-black mb-4 uppercase tracking-wider flex items-center gap-2 txt-titulo">🛣️ Forçar Rota</h3>
                <input type="text" id="ajusteRuaInput" class="w-full bg-slate-50 border rounded-xl mb-4 outline-none focus:border-tema pad-input txt-base" placeholder="Apenas nome (Ex: Caetano)">
                <div class="flex gap-3">
                    <button onclick="trocarRotaManual(1)" class="flex-1 bg-tema text-white rounded-xl font-bold active:opacity-90 active:scale-95 shadow-sm pad-input txt-botao">ROTA 1</button>
                    <button onclick="trocarRotaManual(2)" class="flex-1 bg-orange-600 text-white rounded-xl font-bold active:opacity-90 active:scale-95 shadow-sm pad-input txt-botao">ROTA 2</button>
                </div>
            </div>
        </div>
    </div>

    <div id="fabContainer" class="fixed z-50 flex flex-col gap-4">
        <button id="fabMic" onclick="iniciarReconhecimentoVoz()" class="bg-tema text-white rounded-full shadow-2xl flex items-center justify-center fab-btn active:scale-90 transition-transform">
            🎤
        </button>
        <button id="fabOk" onclick="processarUmPacote()" class="bg-slate-800 text-white rounded-full shadow-2xl flex items-center justify-center font-black fab-btn active:scale-90 transition-transform border-2 border-slate-600">
            OK
        </button>
    </div>

    <div class="bottom-bar alt-barra-base fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-50 px-2 pb-safe shadow-[0_-4px_20px_-10px_rgba(0,0,0,0.1)] transition-colors duration-300">
        <div class="flex justify-around items-center h-full">
            <button onclick="mudarAba('triagem')" id="tab-triagem" class="flex-1 flex flex-col items-center justify-center gap-1 texto-secundario tab-active w-full h-full">
                <div class="icon-bg p-2 transition-colors"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></div>
                <span class="font-bold tracking-wide" style="font-size: calc(var(--fonte-base) * 0.7)">Triagem</span>
            </button>
            <button onclick="mudarAba('listagem')" id="tab-listagem" class="flex-1 flex flex-col items-center justify-center gap-1 texto-secundario w-full h-full">
                <div class="icon-bg p-2 transition-colors"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg></div>
                <span class="font-bold tracking-wide" style="font-size: calc(var(--fonte-base) * 0.7)">Listas</span>
            </button>
            <button onclick="mudarAba('ajustes')" id="tab-ajustes" class="flex-1 flex flex-col items-center justify-center gap-1 texto-secundario w-full h-full">
                <div class="icon-bg p-2 transition-colors"><svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></div>
                <span class="font-bold tracking-wide" style="font-size: calc(var(--fonte-base) * 0.7)">Ajustes</span>
            </button>
        </div>
    </div>

    <div id="modalConfig" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-[110] p-4 backdrop-blur-sm">
        <div class="card-ui bg-white w-full max-w-sm p-5 rounded-3xl shadow-2xl relative transition-colors duration-300">
            <button onclick="fecharConfiguracoes()" class="absolute top-4 right-4 bg-slate-100 card-ui w-10 h-10 rounded-full flex items-center justify-center font-bold text-xl active:scale-95">×</button>
            <h3 class="font-black text-xl mb-4 border-b pb-3 border-slate-200">Editor Visual</h3>
            
            <div class="space-y-5 mb-4 h-[55vh] overflow-y-auto pr-2 pb-6">
                <div class="bg-slate-50 card-ui p-4 rounded-xl border border-slate-200">
                    <label class="block text-xs font-bold mb-3 texto-secundario uppercase">Tema Visual</label>
                    <div class="flex items-center justify-between mb-3">
                        <span class="font-bold">Cor Principal</span>
                        <input type="color" id="inputCorTema" class="w-10 h-10 rounded cursor-pointer border-0 p-0 bg-transparent" onchange="previewVar('--cor-tema', this.value, '')">
                    </div>
                    <div class="flex items-center justify-between border-t border-slate-200 pt-3">
                        <span class="font-bold">Modo Noturno</span>
                        <input type="checkbox" id="inputModoEscuro" class="w-6 h-6 accent-tema cursor-pointer" onchange="document.body.classList.toggle('dark-mode', this.checked)">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold mb-1 texto-secundario uppercase">Tamanho: Letras (Geral)</label>
                    <input type="range" id="slFonteGeral" min="12" max="24" class="w-full" oninput="previewVar('--fonte-base', this.value, 'px')">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 texto-secundario uppercase">Tamanho: Títulos</label>
                    <input type="range" id="slFonteTitulos" min="14" max="32" class="w-full" oninput="previewVar('--fonte-titulos', this.value, 'px')">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 texto-secundario uppercase">Tamanho: Botões</label>
                    <input type="range" id="slFonteBotoes" min="14" max="28" class="w-full" oninput="previewVar('--fonte-botoes', this.value, 'px')">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 texto-secundario uppercase">Espessura: Barra de Topo</label>
                    <input type="range" id="slBarraTopo" min="8" max="32" class="w-full" oninput="previewVar('--barra-topo-p', this.value, 'px')">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 texto-secundario uppercase">Altura: Menu Inferior</label>
                    <input type="range" id="slBarraBase" min="60" max="110" class="w-full" oninput="previewVar('--barra-base-h', this.value, 'px')">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 texto-secundario uppercase">Tamanho: Botão Flutuante (MIC/OK)</label>
                    <input type="range" id="slFab" min="50" max="90" class="w-full" oninput="previewVar('--fab-tamanho', this.value, 'px')">
                </div>
                <div>
                    <label class="block text-xs font-bold mb-1 texto-secundario uppercase">Espaçamento: Margens dos Blocos</label>
                    <input type="range" id="slCard" min="10" max="40" class="w-full" oninput="previewVar('--card-p', this.value, 'px')">
                </div>

		// NOVA FUNÇÃO: Garante um número único do servidor ANTES de preencher
		function reservarProximoId() {
			const refContadorGlobal = modoTrabalho === 'duas' 
				? db.ref(`sessoes_diarias/${dataHoje}/sessao_duas_rotas/contador_global`)
				: db.ref(`sessoes_diarias/${dataHoje}/sessao_uma_rota/${nomeSessao}/contador_global`);

			display.classList.add('animate-pulse');
			document.getElementById('fabOk').style.pointerEvents = 'none'; // Trava o botão OK

			refContadorGlobal.transaction((valorAtual) => {
				return (valorAtual || 0) + 1;
			}, (error, committed, snapshot) => {
				if (error) {
					console.error("Erro ao reservar ID, tentando de novo...", error);
					setTimeout(reservarProximoId, 1000); // Tenta de novo em 1s se a internet oscilar
				} else if (committed) {
					idReservadoAtual = snapshot.val();
					
					// Libera a tela e mostra o número GIGANTE para o operador
					display.innerText = `📦 #${idReservadoAtual}`;
					display.classList.remove('animate-pulse');
					document.getElementById('fabOk').style.pointerEvents = 'auto'; // Libera o botão OK
				}
			});
		}

        async function processarUmPacote() {
			const input = document.getElementById('enderecoInput');
			const notaInp = document.getElementById('notaInput');
			const val = input.value.trim();
			
			if(!val) return;
			
			// Trava de segurança: Se a internet estiver tão lenta que ainda não puxou o ID, bloqueia.
			if(!idReservadoAtual) {
				alert("Aguarde o sistema alocar o número do pacote!");
				return;
			}
			const cepValido = await validarCepAvisoAsync(val);
    if (!cepValido) return; 

    input.disabled = true;
    notaInp.disabled = true;
			notaInp.disabled = true;

			const ruaBase = extrairNomeRua(val);
			const rConhecida = dicionarioRuas[ruaBase];
			const cExata = dicionarioEnderecosExatos[padronizarTexto(val)];

			let endFinal = val; 
			let nota = "-";
			
			// Lógica de Plus Codes e aproximação
			if (cExata) {
				if (cExata.plusCode) endFinal = cExata.plusCode;
				if (cExata.notas) nota = cExata.notas;
			} else {
				let achouAproximado = false;
				const matchNum = val.match(/\d+/);
				
				if (matchNum && dicionarioAproximados[ruaBase]) {
					const numDigitado = parseInt(matchNum[0]);
					const numerosMapeados = Object.keys(dicionarioAproximados[ruaBase]);
					
					for (let numMapeado of numerosMapeados) {
						if (Math.abs(numDigitado - parseInt(numMapeado)) <= 100) {
							endFinal = dicionarioAproximados[ruaBase][numMapeado].plusCode;
							nota = `Loc. APROX. (${val})`; 
							achouAproximado = true; break;
						}
					}
				}
				if (!achouAproximado) {
					const temPlusCodeNaRua = dicionarioAproximados[ruaBase] || Object.keys(dicionarioEnderecosExatos).some(key => extrairNomeRua(key) === ruaBase);
					if (temPlusCodeNaRua) { nota = "Alerta. PlusCode Possivel"; }
				}
			}

			const notaAvulsa = notaInp.value.trim();
			if (notaAvulsa) { 
				nota = nota !== "-" ? `${nota} | ${notaAvulsa}` : notaAvulsa; 
				dbNotas.child(padronizarTexto(endFinal)).set(notaAvulsa);
				dbNotas.child(padronizarTexto(ruaBase)).set(notaAvulsa); 
			}

			const itemBase = {
				"Display ID": idReservadoAtual.toString(), // 👉 USA O NÚMERO PRÉ-ALOCADO EXCLUSIVO DELE
				"Destination Address": endFinal,
				"City": "-",
				"Notas": nota,
				"_ruaBase": ruaBase,
				"_status": modoTrabalho === 'uma' ? '1' : (rConhecida || 'pendente')
			};

			// Salva direto no banco e DEPOIS limpa a tela e pede um novo número
			db.ref(getPathSessao()).push(itemBase).then(() => {
				// Libera a tela
				input.value = ""; input.disabled = false; input.focus();
				notaInp.value = ""; notaInp.disabled = false;
				document.getElementById('sugestoesDropdown').classList.add('hidden');
				
				// Puxa o próximo número para o próximo pacote
				idReservadoAtual = null; 
				reservarProximoId(); 
			}).catch(e => {
				alert("Erro de conexão ao salvar pacote. Tente novamente.");
				input.disabled = false; notaInp.disabled = false;
			});
		}

                            <button onclick="ensinarEResolver('${i._firebaseKey}', 2, '${i._ruaBase}')" class="flex-1 bg-orange-600 text-white pad-input rounded-lg font-bold shadow-sm active:scale-95 transition txt-base">ROTA 2</button>

            } else {

            }

        function extrairNomeRua(e) {
            const b = padronizarTexto(e);
            const m = b.match(/^([^0-9]+)/);
            return m ? m[1].trim() : b;
        }

        function padronizarTexto(texto) {
            let l = texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[,.-]/g, ' ');
            const d = {'\\b(rua|r)\\b':'','\\b(avenida|av|ave)\\b':'','\\b(travessa|tv|trav)\\b':''};
            for (let r in d) l = l.replace(new RegExp(r, 'g'), d[r]);
            return l.replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
        }

        async function verNoMapa(endereco) {
            try {
                const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(endereco)}.json?access_token=${mbt}&country=br&limit=1`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.features && data.features.length > 0) {
                    const [lng, lat] = data.features[0].center;
                    map.setView([lat, lng], 16);
                    marker.setLatLng([lat, lng]).setOpacity(1);
                }
            } catch (e) { console.error(e); }
        }

        function ensinarEResolver(k, r, b) {
            dbRuas.child(b).set(r.toString());
            db.ref(getPathSessao()).child(k).update({ _status: r.toString() });
        }

        async function baixarPlanilha(dados, nome) {
            if (dados.length === 0) { alert("Rota vazia!"); return; }
            const dl = dados.map(item => ({ 
    "ID Pacote": item["Display ID"], 
    "Notes": item.Notas || "-", 
    "City": configSessao.cidade, // Usa a cidade selecionada no login
    "Destination Address": item["Destination Address"] 
}));
            const ws = XLSX.utils.json_to_sheet(dl);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Entregas");
            try {
                if (navigator.canShare) {
                    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                    const file = new File([wbout], nome, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({ title: 'Rota ' + nome, text: 'Planilha pronta', files: [file] });
                        return; 
                    }
                }
            } catch (e) { console.log("Compartilhamento cancelado:", e); }
            XLSX.writeFile(wb, nome);
        }

            activeTab.classList.add('text-tema');
            
            const fabContainer = document.getElementById('fabContainer');
            if(nome === 'triagem') {
                fabContainer.classList.remove('hidden');
                setTimeout(() => map.invalidateSize(), 100);
            } else { fabContainer.classList.add('hidden'); }
        }

        function trocarRotaManual(r) {
            const rua = document.getElementById('ajusteRuaInput').value.trim();
            if(!rua) return;
            dbRuas.child(extrairNomeRua(rua)).set(r.toString());
            alert("Rua atualizada!");
            document.getElementById('ajusteRuaInput').value = '';
        }

        function salvarCorrecaoExata() {
            const o = document.getElementById('memEndOriginal').value;
            const p = document.getElementById('memPlusCode').value;
            const n = document.getElementById('memNotas').value;
            const isAproximado = document.getElementById('memAproximado').checked;
            if(!o) return;
            dbEnderecosExatos.child(padronizarTexto(o)).set({ plusCode: p, notas: n });
            if (isAproximado) {
                const ruaBase = extrairNomeRua(o);
                const matchNum = o.match(/\d+/);
                if (matchNum) { dbAproximados.child(ruaBase).child(matchNum[0]).set({ plusCode: p, enderecoBase: o }); } 
                else { alert("⚠️ O endereço precisa de um número para aproximação."); return; }
            }
            alert("Salvo com sucesso!");
            document.getElementById('memEndOriginal').value = '';
            document.getElementById('memPlusCode').value = '';
            document.getElementById('memNotas').value = '';
            document.getElementById('memAproximado').checked = false;
        }

        function iniciarReconhecimentoVoz() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) { alert("Microfone não suportado. Use o Google Chrome no celular."); return; }
    const recognition = new SpeechRecognition();
    recognition.lang = 'pt-BR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    const btnMic = document.getElementById('btnMic');
    const fabMic = document.getElementById('fabMic');
    const inputEnd = document.getElementById('enderecoInput');
    
    btnMic.classList.add('text-rose-500', 'animate-pulse');
    fabMic.classList.replace('bg-tema', 'bg-rose-500');
    fabMic.classList.add('animate-pulse');
    inputEnd.placeholder = "Ouvindo...";

    recognition.start();

    recognition.onresult = async (event) => {
        const termoFalado = event.results[0][0].transcript; // Ex: "fidelis 1183"
        inputEnd.value = termoFalado; 
        
        btnMic.classList.remove('text-rose-500', 'animate-pulse');
        fabMic.classList.replace('bg-rose-500', 'bg-tema');
        fabMic.classList.remove('animate-pulse');
        inputEnd.placeholder = "Buscando localização...";

        // 👇 1. LÓGICA DE EXTRAÇÃO DE NÚMERO
        // Tira o número da fala. Se você falou "Fidelis 1183", ele guarda o "1183"
        const matchNum = termoFalado.match(/\d+/);
        const numeroFalado = matchNum ? matchNum[0] : null;

        try {
            // 👇 2. TRAVA GEOGRÁFICA (Para achar ruas só na sua cidade)
            const offsetGraus = configSessao.raioKm / 111; 
            const minLng = configSessao.centro[0] - offsetGraus;
            const minLat = configSessao.centro[1] - offsetGraus;
            const maxLng = configSessao.centro[0] + offsetGraus;
            const maxLat = configSessao.centro[1] + offsetGraus;
            const bboxStr = `${minLng},${minLat},${maxLng},${maxLat}`;
            const proxStr = `${configSessao.centro[0]},${configSessao.centro[1]}`;

            // Busca no mapbox usando a trava da cidade
            const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(termoFalado)}.json?access_token=${mbt}&country=br&bbox=${bboxStr}&proximity=${proxStr}&types=address,poi&limit=1`;
            
            const res = await fetch(url);
            const data = await res.json();
            
            if(data.features && data.features.length > 0) {
                const f = data.features[0];
                let nomeRetornado = f.place_name.replace(/'/g, "\\'");
                
                // 👇 3. FORMATAÇÃO E MONTAGEM DO ENDEREÇO
                let partes = nomeRetornado.split(',');
                let rua = partes[0].trim();
                rua = rua.replace(/\s+\d+$/, ''); // Limpa números no final do nome da rua, se houver
                
                let restoArray = partes.slice(1).map(p => p.trim());
                
                // Evita duplicar o número caso o mapbox também tenha devolvido ele
                if (numeroFalado && restoArray[0] === numeroFalado) {
                    restoArray.shift(); 
                }
                let resto = restoArray.join(', ');

                if (numeroFalado) {
                    // Se você falou número (Ex: Fidelis 1183), ele já monta 100% pronto!
                    inputEnd.value = `${rua}, ${numeroFalado}, ${resto}`;
                } else {
                    // Se você falou só "Fidelis", ele monta com o espaço no meio igual no texto!
                    inputEnd.value = `${rua}, , ${resto}`;
                }

                // Move o mapa
                map.setView([f.center[1], f.center[0]], 17);
                marker.setLatLng([f.center[1], f.center[0]]).setOpacity(1);

                // Checa a nota da rua
                checarNotaAutomatica(rua);

                // Dispara o alerta de CEP (se houver regra na sessão)
                const cepValido = await validarCepAvisoAsync(inputEnd.value);
                if (!cepValido) {
                    inputEnd.value = "";
                    inputEnd.focus();
                    return;
                }

                // 👇 4. CONTROLE INTELIGENTE DO TECLADO
                inputEnd.focus();
                if (!numeroFalado) {
                    // Abre o teclado exatamente no meio das vírgulas para você digitar
                    const pos = rua.length + 2;
                    inputEnd.setSelectionRange(pos, pos);
                } else {
                    // Abre o teclado no final do texto (caso você queira adicionar ex: "Casa 2")
                    const len = inputEnd.value.length;
                    inputEnd.setSelectionRange(len, len);
                }

            } else { 
                alert("Não encontrei endereço próximo com o áudio: " + termoFalado); 
                inputEnd.value = "";
            }
        } catch(e) { console.error("Erro voz:", e); }
        
        inputEnd.placeholder = "Rua e número...";
    };

    recognition.onerror = () => {
        btnMic.classList.remove('text-rose-500', 'animate-pulse');
        fabMic.classList.replace('bg-rose-500', 'bg-tema');
        fabMic.classList.remove('animate-pulse');
        inputEnd.placeholder = "Rua e número...";
    };
    
    recognition.onend = () => {
        btnMic.classList.remove('text-rose-500', 'animate-pulse');
        fabMic.classList.replace('bg-rose-500', 'bg-tema');
        fabMic.classList.remove('animate-pulse');
        if(inputEnd.placeholder === "Ouvindo...") inputEnd.placeholder = "Rua e número...";
    };
}
				// NOVA FUNÇÃO: Transforma cidade em coordenadas e finaliza login
		async function configurarEFinalizarLogin() {
			const cidade = document.getElementById('inputCidade').value.trim();
			configSessao.raioKm = parseInt(document.getElementById('inputRaio').value);
			cepRestricaoSessao = document.getElementById('inputCepRestricao').value.trim().replace('-', '');
			
			if(cidade !== configSessao.cidade) {
				try {
					const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(cidade)}.json?access_token=${mbt}&country=br&types=place&limit=1`;
					const res = await fetch(url);
					const data = await res.json();
					if(data.features && data.features.length > 0) {
						configSessao.centro = data.features[0].center; // [lng, lat]
						configSessao.cidade = cidade;
					}
				} catch(e) { console.error("Erro ao buscar cidade", e); }
			}
			finalizarLogin();
		}

		// NOVA FUNÇÃO: Autopreenchimento
		function checarNotaAutomatica(endereco) {
			const enderecoBase = extrairNomeRua(endereco);
			// Tenta buscar pelo endereço exato ou pela rua base
			const notaSalva = dicionarioNotas[padronizarTexto(endereco)] || dicionarioNotas[padronizarTexto(enderecoBase)];
			if(notaSalva) {
				const inputNota = document.getElementById('notaInput');
				if(!inputNota.value) inputNota.value = notaSalva; // Preenche se estiver vazio
			}
		}

		// ATUALIZAÇÃO: Evento de digitação do endereço (substitua o evento existente no window.onload)
		document.getElementById('enderecoInput').addEventListener('input', function() {
			clearTimeout(timeoutBusca);
			const termo = this.value.trim();
			const dropdown = document.getElementById('sugestoesDropdown');
			
			if(termo.length < 3) { dropdown.classList.add('hidden'); return; }
			
			// Autopreenchimento enquanto digita
			checarNotaAutomatica(termo);

			timeoutBusca = setTimeout(async () => {
				// Cálculo do Bounding Box baseado no centro e raio (1 grau ≈ 111km)
				const offsetGraus = configSessao.raioKm / 111; 
				const minLng = configSessao.centro[0] - offsetGraus;
				const minLat = configSessao.centro[1] - offsetGraus;
				const maxLng = configSessao.centro[0] + offsetGraus;
				const maxLat = configSessao.centro[1] + offsetGraus;
				const bboxStr = `${minLng},${minLat},${maxLng},${maxLat}`;
				const proxStr = `${configSessao.centro[0]},${configSessao.centro[1]}`;

				const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(termo)}.json?access_token=${mbt}&country=br&bbox=${bboxStr}&proximity=${proxStr}&types=address,poi&autocomplete=true&limit=5`;
				
				try {
					const res = await fetch(url);
					const data = await res.json();
					if(data.features && data.features.length > 0) {
						dropdown.innerHTML = data.features.map(f => `
							<div onclick="selecionarSugestaoMapbox('${f.place_name.replace(/'/g, "\\'")}', ${f.center[0]}, ${f.center[1]})" 
								 class="p-4 active:bg-slate-100 cursor-pointer border-b border-slate-200 txt-base font-medium">
								📍 ${f.place_name}
							</div>`).join('');
						dropdown.classList.remove('hidden');
					} else { dropdown.classList.add('hidden'); }
				} catch(e) { console.error(e); }
			}, 400);
		});
		
		// Função que desenha o Modal na tela e aguarda a resposta do usuário
function solicitarConfirmacaoCepUI(cepEncontrado, cepEsperado) {
    return new Promise((resolve) => {
        const modal = document.getElementById('modalCep');
        const content = document.getElementById('modalCepContent');
        const texto = document.getElementById('modalCepTexto');
        const btnDescartar = document.getElementById('btnDescartarCep');
        const btnManter = document.getElementById('btnIgnorarCep');

        texto.innerHTML = `Endereço fora da região padrão.<br><br>CEP identificado: <b class="text-slate-800">${cepEncontrado}</b><br>Filtro da rota: <b class="text-rose-500">${cepEsperado}</b>`;

        // Mostra e anima a entrada
        modal.classList.remove('hidden');
        setTimeout(() => content.classList.replace('scale-95', 'scale-100'), 10);

        const fecharModal = (resultado) => {
            content.classList.replace('scale-100', 'scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                resolve(resultado);
            }, 200);
            
            btnDescartar.onclick = null;
            btnManter.onclick = null;
        };

        btnDescartar.onclick = () => fecharModal(false);
        btnManter.onclick = () => fecharModal(true);
    });
}

// Lógica inteligente que busca o CEP em milissegundos
async function validarCepAvisoAsync(enderecoStr) {
    if (!cepRestricaoSessao) return true; // Se não tem regra, passa direto
    if (enderecoStr === ultimoEnderecoPermitidoCep) return true; // Se já aprovou este endereço antes, não avisa de novo
    
    let cepEncontrado = "";
    const matchCep = enderecoStr.match(/\b\d{5}-?\d{3}\b/);
    
    if (matchCep) {
        cepEncontrado = matchCep[0];
    } else {
        try {
            const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(enderecoStr)}.json?access_token=${mbt}&country=br&limit=1`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.features && data.features.length > 0) {
                const pc = data.features[0].context?.find(c => c.id.includes('postcode'));
                if (pc) {
                    cepEncontrado = pc.text;
                } else {
                    const m = data.features[0].place_name.match(/\b\d{5}-?\d{3}\b/);
                    if (m) cepEncontrado = m[0];
                }
            }
        } catch(e) { console.error(e); }
    }

    if (cepEncontrado) {
        const cepLimpo = cepEncontrado.replace('-', '');
        const restricaoLimpa = cepRestricaoSessao.replace('-', '');
        
        if (!cepLimpo.startsWith(restricaoLimpa)) {
            // Se for diferente, chama o Modal bonito e espera ele clicar
            const querManter = await solicitarConfirmacaoCepUI(cepEncontrado, cepRestricaoSessao);
            if (querManter) {
                ultimoEnderecoPermitidoCep = enderecoStr; // Salva na memória
                return true;
            } else {
                return false;
            }
        }
    }
    return true;
}

		async function selecionarSugestaoMapbox(nome, lng, lat) {
    const input = document.getElementById('enderecoInput');
    
    // O nome vem assim: "Rua Fidelis Batista de Aguiar, Santa Felicidade, Cascavel..."
    // Vamos dividir na primeira vírgula para separar a rua do resto
    let partes = nome.split(',');
    let rua = partes[0].trim();
    let resto = partes.slice(1).join(',').trim();
    
    // Monta o texto deixando o espaço central para o número: "Rua, , Bairro, Cidade"
    // O espaço extra entre as vírgulas facilita a digitação no celular
    input.value = `${rua} , ${resto}`;
    
    document.getElementById('sugestoesDropdown').classList.add('hidden');
    map.setView([lat, lng], 17);
    marker.setLatLng([lat, lng]).setOpacity(1);
    
    // FOCO E POSICIONAMENTO:
    input.focus();
    // Posiciona o cursor logo após a primeira vírgula e o espaço
    const posicaoCursor = rua.length + 2; 
    input.setSelectionRange(posicaoCursor, posicaoCursor);
    
    checarNotaAutomatica(rua);

    const cepValido = await validarCepAvisoAsync(nome);
    if (!cepValido) {
        input.value = "";
        input.focus();
    }
}

}
