<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processador Cloud - Triagem Visual por Mapa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .loader { border-top-color: #4f46e5; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #mapContainer { height: 600px; position: sticky; top: 1rem; z-index: 10; }
        #map { height: 100%; width: 100%; border-radius: 1rem; border: 4px solid white; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        
        /* Badges de Rota */
        .rota-1-badge { background-color: #fee2e2; color: #b91c1c; border-color: #fecaca; }
        .rota-2-badge { background-color: #dbeafe; color: #1e40af; border-color: #bfdbfe; }
        .pendente-badge { background-color: #f1f5f9; color: #475569; border-color: #e2e8f0; }

        /* Estilo dos Marcadores Customizados */
        .marker-pin {
            width: 30px; height: 30px; border-radius: 50% 50% 50% 0;
            position: absolute; transform: rotate(-45deg); left: 50%; top: 50%; margin: -15px 0 0 -15px;
            display: flex; align-items: center; justify-content: center; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .marker-pin i { transform: rotate(45deg); color: white; font-size: 12px; }
        
        .pin-gray { background: #94a3b8; }
        .pin-red { background: #ef4444; }
        .pin-blue { background: #3b82f6; }
        
        /* Ajuste fino para os balões do Leaflet */
        .leaflet-popup-content-wrapper { border-radius: 1rem; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2); overflow: hidden; }
        .leaflet-popup-content { margin: 0 !important; width: 240px !important; }
        .leaflet-container a.leaflet-popup-close-button { top: 8px; right: 8px; color: #64748b; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased p-4 md:p-8">

    <div class="max-w-7xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        <div class="bg-indigo-700 p-6 text-white">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold flex items-center gap-2">
                    <i class="fas fa-map-marked-alt text-indigo-300"></i>
                    Triagem Visual Inteligente
                </h1>
                <div class="flex items-center gap-2">
                    <span id="cloudStatus" class="flex items-center gap-1 text-xs bg-indigo-800/50 px-3 py-1 rounded-full text-indigo-200">
                        <i class="fas fa-circle-notch fa-spin"></i> Conectando Firebase...
                    </span>
                    <span class="bg-indigo-900 px-3 py-1 rounded-full text-xs font-mono border border-indigo-500/30">v9.5 (Controle Individual)</span>
                </div>
            </div>
        </div>

        <div class="p-6 space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 space-y-4">
                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-2 gap-4">
                        <input type="text" id="mapboxToken" value="pk.eyJ1IjoibWVybG91dCIsImEiOiJjbW8xeGV1YWwwcDQwMnBva242ZTJ0cmI5In0.SpwaxXYyWY25zIwVKdtT2w" class="hidden" />
                        <div>
                            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Filtro de CEP</label>
                            <input type="text" id="cepAlvo" placeholder="Ex: 85817" class="w-full border border-slate-300 rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
                        </div>
                        <div class="flex items-end">
                            <button onclick="window.processarFila()" id="btnProcessar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-2 rounded-lg transition-all shadow-md flex items-center justify-center gap-2 text-sm">
                                <i class="fas fa-play"></i> Iniciar Processamento
                            </button>
                        </div>
                    </div>
                    <textarea id="jsonInput" rows="3" placeholder="Cole o JSON aqui..." class="w-full border border-slate-300 rounded-xl p-3 text-xs font-mono bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>
                
                <div id="statusArea" class="hidden flex flex-col justify-center bg-indigo-50 p-6 rounded-xl border border-indigo-100">
                    <div class="flex items-center justify-between mb-2">
                        <span id="progressText" class="text-xs font-bold text-indigo-600 uppercase">Mapeando...</span>
                        <div class="loader rounded-full border-2 border-t-2 border-indigo-200 h-4 w-4"></div>
                    </div>
                    <div class="w-full bg-indigo-200 rounded-full h-1.5 overflow-hidden">
                        <div id="progressBar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div id="resultsContainer" class="hidden space-y-6">
                <div class="flex flex-wrap gap-4 items-center justify-between bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div class="flex gap-6">
                        <div class="text-center">
                            <span class="block text-[10px] font-bold text-slate-400 uppercase">Total</span>
                            <span id="countTotal" class="text-xl font-black text-slate-700">0</span>
                        </div>
                        <div class="text-center">
                            <span class="block text-[10px] font-bold text-slate-400 uppercase">Pendentes</span>
                            <span id="countPendente" class="text-xl font-black text-slate-400">0</span>
                        </div>
                        <div class="text-center border-l border-slate-200 pl-6">
                            <span class="block text-[10px] font-bold text-red-400 uppercase">Rota 1</span>
                            <span id="countRota1" class="text-xl font-black text-red-600">0</span>
                        </div>
                        <div class="text-center">
                            <span class="block text-[10px] font-bold text-blue-400 uppercase">Rota 2</span>
                            <span id="countRota2" class="text-xl font-black text-blue-600">0</span>
                        </div>
                    </div>
                    
                    <div class="flex gap-2">
                        <button onclick="window.exportarRotaUnica(1)" class="bg-white hover:bg-red-50 text-red-700 border border-red-200 font-bold py-2.5 px-4 rounded-lg transition-all shadow-sm flex items-center gap-2 text-sm">
                            <i class="fas fa-file-download"></i> Baixar Rota 1
                        </button>
                        <button onclick="window.exportarRotaUnica(2)" class="bg-white hover:bg-blue-50 text-blue-700 border border-blue-200 font-bold py-2.5 px-4 rounded-lg transition-all shadow-sm flex items-center gap-2 text-sm">
                            <i class="fas fa-file-download"></i> Baixar Rota 2
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div class="lg:col-span-4 space-y-3 max-h-[600px] overflow-y-auto pr-2" id="resultsList"></div>

                    <div class="lg:col-span-8">
                        <div id="mapContainer">
                            <div id="map"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDkVx0C_d9iAKdq6Ip22p4qQ6RYDhZvk-s",
            authDomain: "rodao-f93c2.firebaseapp.com",
            projectId: "rodao-f93c2",
            storageBucket: "rodao-f93c2.firebasestorage.app",
            messagingSenderId: "867137990526",
            appId: "1:867137990526:web:833eed12a9c2e50c9a0d2f",
            databaseURL: "https://rodao-f93c2-default-rtdb.firebaseio.com/"
        };
        const appId = 'rodao-f93c2';

        let app, auth, db;
        let currentUser = null;
        let memoriaLocal = {};
        let map;
        let markersMap = {}; 

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            signInAnonymously(auth);
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    document.getElementById('cloudStatus').innerHTML = '<i class="fas fa-cloud-check text-emerald-400"></i> Banco Ativo';
                    carregarMemoria();
                }
            });
        } catch (e) { console.error(e); }

        function carregarMemoria() {
            if (!currentUser) return;
            const colRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'enderecos_memoria');
            onSnapshot(colRef, (snap) => {
                snap.forEach(d => { memoriaLocal[d.id] = d.data(); });
            });
        }

        function initMap() {
            if (map) return;
            map = L.map('map').setView([-24.9555, -53.4552], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM' }).addTo(map);
        }

        function createCustomIcon(colorClass) {
            return L.divIcon({
                className: 'custom-div-icon',
                html: `<div class='marker-pin ${colorClass}'><i class='fas fa-home'></i></div>`,
                iconSize: [30, 42],
                iconAnchor: [15, 42],
                popupAnchor: [0, -45]
            });
        }

        // --- FUNÇÃO DE REMOVER ENDEREÇO ---
        window.removerEndereco = function(id) {
            // Remove da matriz principal
            window.enderecosFinais = window.enderecosFinais.filter(e => e.id !== id);
            
            // Remove do mapa
            if (markersMap[id]) {
                map.removeLayer(markersMap[id]);
                delete markersMap[id];
            }
            
            // Remove da lista HTML
            const el = document.getElementById(id);
            if (el) el.remove();
            
            atualizarContadores();
        };

        // --- FUNÇÃO DE ATRIBUIR (Individual vs Rua) ---
        window.atribuirRota = async function(id, manualRota, aplicarNaRuaToda) {
            const itemOrigem = window.enderecosFinais.find(e => e.id === id);
            if (!itemOrigem) return;

            // Salva no Firebase
            if (currentUser) {
                // Se for rua toda, salva na chave da rota. Se for individual, salva na chave exata.
                const docId = aplicarNaRuaToda ? itemOrigem.chave_rota : itemOrigem.chave_exata;
                const docRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'enderecos_memoria', docId);
                await setDoc(docRef, { rota: manualRota }, { merge: true });
            }

            // Aplica na Interface
            if (aplicarNaRuaToda) {
                window.enderecosFinais.forEach(item => {
                    if (item.chave_rota === itemOrigem.chave_rota) {
                        item.rota = manualRota;
                        atualizarPinoECard(item);
                    }
                });
            } else {
                itemOrigem.rota = manualRota;
                atualizarPinoECard(itemOrigem);
            }

            atualizarContadores();
        };

        function atualizarPinoECard(item) {
            const marker = markersMap[item.id];
            if (marker) {
                let color = 'pin-gray';
                if (item.rota === 1) color = 'pin-red';
                if (item.rota === 2) color = 'pin-blue';
                marker.setIcon(createCustomIcon(color));
                map.closePopup(); 
            }
            atualizarItemUI(item.id, item);
        }

        window.processarFila = async function() {
            const token = document.getElementById('mapboxToken').value;
            const jsonRaw = document.getElementById('jsonInput').value;
            const cepFiltro = document.getElementById('cepAlvo').value.replace(/\D/g, '');
            
            if (!jsonRaw) return alert("Cole o JSON.");
            initMap();

            const dados = JSON.parse(jsonRaw);
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('resultsContainer').classList.add('hidden'); 
            document.getElementById('resultsList').innerHTML = '';
            window.enderecosFinais = [];
            markersMap = {};

            for (let i = 0; i < dados.length; i++) {
                const item = dados[i];
                document.getElementById('progressBar').style.width = `${((i+1)/dados.length)*100}%`;
                
                const geo = await consultarMapbox(item.query_mapbox, token);
                
                const chaveExata = `${item.rua}_${item.numero}_${item.bairro}`.toLowerCase().replace(/\s+/g, '_');
                const chaveRota = `${item.rua}_${item.bairro}`.toLowerCase().replace(/\s+/g, '_');
                
                const cacheExato = memoriaLocal[chaveExata] || {};
                const cacheRota = memoriaLocal[chaveRota] || {};

                // Prioridade de Memória: Verifica se tem regra exata. Se não, usa a regra da rua.
                let rotaRecuperada = cacheExato.rota !== undefined ? cacheExato.rota : (cacheRota.rota || null);

                const obj = {
                    id: `it_${i}_${Date.now()}`,
                    chave_exata: chaveExata,
                    chave_rota: chaveRota,
                    rua: item.rua, numero: item.numero, bairro: item.bairro,
                    address_line_1: geo ? geo.nome : item.rua,
                    address_line_2: item.complemento || cacheExato.complemento || "",
                    postal_code: (item.linha_original.match(/\b\d{5}(?:-\d{3})?\b/) || [""])[0],
                    lat: geo ? geo.lat : null,
                    lng: geo ? geo.lng : null,
                    rota: rotaRecuperada
                };

                window.enderecosFinais.push(obj);
                
                if (obj.lat && obj.lng) {
                    let color = 'pin-gray';
                    if (obj.rota === 1) color = 'pin-red';
                    if (obj.rota === 2) color = 'pin-blue';

                    const m = L.marker([obj.lat, obj.lng], { icon: createCustomIcon(color) }).addTo(map);
                    
                    // Novo Layout do Popup do Mapa
                    const popupContent = `
                        <div class="p-3 bg-white rounded-xl">
                            <div class="mb-3">
                                <div class="text-sm font-black text-slate-800 leading-tight">${obj.rua}, ${obj.numero}</div>
                                <div class="text-xs text-slate-500 mt-0.5">${obj.bairro}</div>
                            </div>
                            
                            <div class="text-[10px] font-bold text-slate-400 uppercase mb-1">Apenas este número</div>
                            <div class="flex gap-1 mb-3">
                                <button onclick="window.atribuirRota('${obj.id}', 1, false)" class="flex-1 bg-red-100 hover:bg-red-500 hover:text-white text-red-700 py-1.5 rounded text-[10px] font-bold transition-colors">🔴 Rota 1</button>
                                <button onclick="window.atribuirRota('${obj.id}', 2, false)" class="flex-1 bg-blue-100 hover:bg-blue-500 hover:text-white text-blue-700 py-1.5 rounded text-[10px] font-bold transition-colors">🔵 Rota 2</button>
                            </div>

                            <div class="text-[10px] font-bold text-slate-400 uppercase mb-1">Rua inteira</div>
                            <div class="flex gap-1 mb-3">
                                <button onclick="window.atribuirRota('${obj.id}', 1, true)" class="flex-1 border border-red-300 hover:bg-red-50 text-red-600 py-1.5 rounded text-[10px] font-bold transition-colors">🔴 Rota 1</button>
                                <button onclick="window.atribuirRota('${obj.id}', 2, true)" class="flex-1 border border-blue-300 hover:bg-blue-50 text-blue-600 py-1.5 rounded text-[10px] font-bold transition-colors">🔵 Rota 2</button>
                            </div>
                            
                            <div class="flex gap-1 border-t border-slate-100 pt-3">
                                <button onclick="window.atribuirRota('${obj.id}', null, false)" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-1.5 rounded text-[10px] font-bold transition-colors">Pendente</button>
                                <button onclick="window.removerEndereco('${obj.id}')" class="flex-1 bg-red-50 text-red-600 border border-red-200 py-1.5 rounded text-[10px] font-bold transition-colors"><i class="fas fa-trash"></i> Remover</button>
                            </div>
                        </div>
                    `;
                    
                    m.bindPopup(popupContent);
                    markersMap[obj.id] = m;
                }

                renderizarItemLista(obj);
            }

            document.getElementById('statusArea').classList.add('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');
            
            setTimeout(() => {
                map.invalidateSize(); 
                const group = new L.featureGroup(Object.values(markersMap));
                if (Object.keys(markersMap).length > 0) {
                    map.fitBounds(group.getBounds().pad(0.1));
                }
            }, 300);

            atualizarContadores();
        };

        function renderizarItemLista(row) {
            const container = document.getElementById('resultsList');
            const div = document.createElement('div');
            div.id = row.id;
            container.appendChild(div);
            atualizarItemUI(row.id, row);
        }

        function atualizarItemUI(id, row) {
            const el = document.getElementById(id);
            if (!el) return;

            let badge = `<span class="pendente-badge px-2 py-0.5 rounded text-[10px] font-bold border">PENDENTE</span>`;
            let border = "border-slate-200";
            if (row.rota === 1) {
                badge = `<span class="rota-1-badge px-2 py-0.5 rounded text-[10px] font-bold border">ROTA 1</span>`;
                border = "border-red-300 bg-red-50/50";
            } else if (row.rota === 2) {
                badge = `<span class="rota-2-badge px-2 py-0.5 rounded text-[10px] font-bold border">ROTA 2</span>`;
                border = "border-blue-300 bg-blue-50/50";
            }

            el.className = `p-3 border-2 rounded-xl transition-all mb-2 hover:shadow-md relative ${border}`;
            
            el.innerHTML = `
                <div class="flex justify-between items-start cursor-pointer" onclick="focarNoMapa('${id}')">
                    <div class="pr-8 w-full">
                        <div class="text-xs font-black uppercase text-slate-700 leading-none">${row.rua}, ${row.numero}</div>
                        <div class="text-[10px] text-slate-400 mt-1 mb-2">${row.bairro}</div>
                        ${badge}
                    </div>
                </div>
                <button onclick="window.removerEndereco('${id}')" class="absolute top-3 right-3 text-slate-300 hover:text-red-500 transition-colors p-1" title="Remover este endereço">
                    <i class="fas fa-times"></i>
                </button>
            `;
        }
        
        window.focarNoMapa = function(id) {
            const row = window.enderecosFinais.find(e => e.id === id);
            if (row && row.lat) {
                map.flyTo([row.lat, row.lng], 16, { animate: true, duration: 1.0 });
                setTimeout(() => { if (markersMap[id]) markersMap[id].openPopup(); }, 1000); 
            }
        };

        function atualizarContadores() {
            const r1 = window.enderecosFinais.filter(e => e.rota === 1).length;
            const r2 = window.enderecosFinais.filter(e => e.rota === 2).length;
            const total = window.enderecosFinais.length;
            document.getElementById('countTotal').innerText = total;
            document.getElementById('countPendente').innerText = total - (r1 + r2);
            document.getElementById('countRota1').innerText = r1;
            document.getElementById('countRota2').innerText = r2;
        }

        async function consultarMapbox(q, t) {
            try {
                const r = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(q)}.json?access_token=${t}&country=BR&bbox=-53.53,-25.02,-53.37,-24.89&types=address`);
                const d = await r.json();
                return d.features?.[0] ? { nome: d.features[0].place_name, lng: d.features[0].center[0], lat: d.features[0].center[1] } : null;
            } catch (e) { return null; }
        }

        // --- FUNÇÃO DE EXPORTAÇÃO INDIVIDUAL ---
        window.exportarRotaUnica = function(numRota) {
            const lista = window.enderecosFinais.filter(e => e.rota === numRota);
            
            if (lista.length === 0) {
                alert(`Não há endereços atribuídos à Rota ${numRota}.`);
                return;
            }

            let csv = "data:text/csv;charset=utf-8,\uFEFFAddress Line 1,Address Line 2,City,State,Postal Code,Extra\n";
            lista.forEach(r => {
                csv += `"${r.address_line_1}","${r.address_line_2}","Cascavel","PR","${r.postal_code}",""\n`;
            });
            
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csv));
            link.setAttribute("download", `ROTA_${numRota}_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</body>
</html>
